[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragforge"
version = "0.1.0"
description = "Production-ready technical knowledge assistant: hybrid retrieval, BGE reranking, cited answers, evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: loads real HuggingFace models (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is natural language sent to the model; hard-wrapping it would change the prompt.
"app/generation/prompts.py" = ["E501"]
"ui/*.py" = ["E501"]
"scripts/*.py" = ["E501"]
